
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProArqui | Arquitetura</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(#0006, #0009),
        url("capa.jpg") center/cover no-repeat, #333;
    }
    main { padding: 30px; }
    img { max-width: 180px; max-height: 100px; object-fit: contain; }
    h1 { font-size: clamp(32px, 5vw, 60px); font-weight: 400; }
    p { margin: 20px auto 30px; }
    a {
      display: inline-block;
      padding: 16px 25px;
      color: white;
      border: 1px solid white;
      text-decoration: none;
    }
    a:hover { background: white; color: #222; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Logo ProArqui">
    <h1>Explore nossos projetos</h1>
    <p>Conheça nossos ambientes em uma experiência imersiva 360°.</p>
    <a href="tour/index.html">ENTRAR NO AMBIENTE 360°</a>
  </main>
</body>
</html>
